baseURL = "https://rfive.ai/"
title = "R5 | AI Strategy, Engineering, and Fractional CTO Consulting"
languageCode = "en-us"
defaultContentLanguage = "en"
timeZone = "UTC"
enableRobotsTXT = true
enableGitInfo = true
summaryLength = 70
disableKinds = ["taxonomy", "term"]

[pagination]
  pagerSize = 5
copyright = "© {{ now.Year }} R5 LLC"

[module]
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.mounts]]
    source = "docs/decks/custom-ai-solution.html"
    target = "static/decks/custom-ai-solution/index.html"
  [[module.mounts]]
    source = "docs/decks/assets"
    target = "static/decks/custom-ai-solution/assets"
  [[module.imports]]
    path = "github.com/dillonzq/LoveIt"

[outputs]
  home = ["HTML", "RSS", "JSON"]
  section = ["HTML"]
  page = ["HTML"]

[params]
  description = "R5 helps founders and executive teams turn AI strategy into production systems, internal capability, and technical roadmaps."
  defaultTheme = "dark"
  disableThemeSwitcher = true
  dateFormat = "Jan 2, 2006"
  images = ["/hero.png"]
  [params.header]
    desktopMode = "fixed"
    mobileMode = "auto"
    [params.header.title]
      logo = ""
      name = "R5"
      pre = ""
      post = ""
      typeit = false
  [params.social]
    Linkedin = "romerocesar"
    Email = "cesar@rfive.ai"
  [params.app]
    title = "R5"
    noFavicon = false
  [params.home]
    [params.home.profile]
      enable = true
      title = '<span class="home-title-line">You know your business.</span><span class="home-title-line">We know AI.</span>'
      subtitle = "Move forward with clarity, confidence, and momentum."
      typeit = false
      social = false
      imageUrl = "img/rfive-logo.svg"
      imageTitle = "R5"
      imageWidth = 160
      imageHeight = 160
  [params.footer]
    enable = true
    since = 2023
    custom = "AI advisory and engineering."
    hugo = false
    copyright = true
    author = false
  [params.analytics]
    enable = false
  [params.author]
    name = "R5"
    email = "cesar@rfive.ai"
    link = "https://rfive.ai"
  [params.page]
    linkToMarkdown = false
    [params.page.toc]
      enable = false
    [params.page.share]
      enable = false
    [params.page.seo.publisher]
      name = "R5"
  [params.seo]
    image = "/hero.png"
    thumbnailUrl = "/hero.png"
  [params.verification]
    # Add the Google Search Console HTML tag content here after creating the property.
    # Example: google = "abc123..."
    google = ""

[permalinks]
  page = "/:slug/"
  posts = "/blog/:slug/"

[privacy]
  [privacy.googleAnalytics]
    anonymizeIP = true
    respectDoNotTrack = true
    useSessionStorage = false
  [privacy.instagram]
    disable = true
  [privacy.x]
    disable = true
  [privacy.vimeo]
    disable = true
  [privacy.youtube]
    privacyEnhanced = true
